version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:5000"
    environment:
      - MODEL_NAME=claude-3-local
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://llmuser:llmpass@db:5432/llmdb
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - db
      - cache
    volumes:
      - ./app.py:/app/app.py
      - ./logs:/app/logs
    command: python app.py
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=llmdb
      - POSTGRES_USER=llmuser
      - POSTGRES_PASSWORD=llmpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: